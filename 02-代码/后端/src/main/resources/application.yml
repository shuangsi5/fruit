server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: fruit-trade-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/fruit_trade_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.fruittrade.domain.entity

# JWT configuration
jwt:
  secret: fruit-trade-smart-system-jwt-secret-key-2026-keep-it-long-enough
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# Cross-origin configuration
cors:
  enabled: true
  allowed-origins: "*"

# Recommendation engine configuration
recommendation:
  weight-frequency: 0.5
  weight-cf: 0.3
  weight-hot: 0.2
  top-k-similar: 20
  cache-ttl-minutes: 30
  default-limit: 10
  max-limit: 50
  purchase-window-days: 180
  hot-window-days: 30

# Warning engine configuration
warning:
  expiring-thresholds: 30,7,3
  loss-risk-thresholds: 0.2,0.4,0.7
  scan-cron: "0 0 2 * * ?"
  enabled: true

# Business constants
business:
  order-timeout-minutes: 30
  after-sale-limit-days: 7
  freight: 0.00

logging:
  level:
    com.fruittrade: debug
    org.springframework.security: info
